<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Crush Finder 💖</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #333;
        }

        .container {
            background: white;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
        }

        h1 {
            margin-bottom: 20px;
            color: hotpink;
        }

        input {
            padding: 10px;
            width: 220px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            font-size: 1em;
        }

        #goBtn {
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            background: hotpink;
            color: white;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            transition: all 0.2s ease;
        }

        #result {
            margin-top: 80px;
            font-weight: bold;
            color: purple;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Secret Crush Finder 💖</h1>
    <p>Enter your name to see your secret admirer:</p>
    <input type="text" id="name" placeholder="Your name"><br>
    <button id="goBtn">GO</button>

    <div id="result"></div>
</div>

<script>
    const btn = document.getElementById("goBtn");
    const container = document.querySelector(".container");
    const result = document.getElementById("result");

    function moveButton() {
        const containerRect = container.getBoundingClientRect();
        const btnWidth = btn.offsetWidth;
        const btnHeight = btn.offsetHeight;

        // random position inside container
        const maxX = containerRect.width - btnWidth - 20;
        const maxY = containerRect.height - btnHeight - 20;

        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        btn.style.left = randomX + "px";
        btn.style.top = randomY + "px";
    }

    // Umiilag kapag nilapitan
    btn.addEventListener("mouseover", moveButton);

    // Kung ma-click man, ipapakita message
    btn.addEventListener("click", function() {
        const name = document.getElementById("name").value.trim();
        if(name === "") {
            result.innerText = "Please enter your name first 😅";
        } else {
            result.innerText = name + ", your secret admirer is… 🤫 Someone very special!";
        }
    });
</script>

</body>
</html>
